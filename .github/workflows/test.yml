name: Test

on:
  push:
    branches: [ main, 'develop/**' ]
  pull_request:
    branches: [ main, 'develop/**' ]

env:
  BUILD_TYPE: Release

jobs:
  test-static:
    name: Test Static on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: "Ninja"
            setup_ninja: true
          - os: macos-latest
            generator: "Ninja"
            setup_ninja: true
          - os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: "-A x64"
            setup_ninja: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Ninja
        if: matrix.setup_ninja
        uses: seanmiddleditch/gha-setup-ninja@v4
      - name: Configure Test Project (Static)
        shell: bash
        run: |
          cmake -S test -B test/build \
            -G "${{ matrix.generator }}" ${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_SHARED_LIBS=OFF
      - name: Build Test Project
        run: |
          cmake --build test/build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Run Tests
        run: ctest --test-dir test/build -C ${{ env.BUILD_TYPE }} --output-on-failure

  test-shared:
    name: Test Shared on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: "Ninja"
            setup_ninja: true
          - os: macos-latest
            generator: "Ninja"
            setup_ninja: true
          - os: windows-latest
            generator: "Visual Studio 17 2022"
            arch: "-A x64"
            setup_ninja: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Ninja
        if: matrix.setup_ninja
        uses: seanmiddleditch/gha-setup-ninja@v4
      - name: Configure Test Project (Shared)
        shell: bash
        run: |
          cmake -S test -B test/build \
            -G "${{ matrix.generator }}" ${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_SHARED_LIBS=ON
      - name: Build Test Project
        run: |
          cmake --build test/build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Run Tests
        run: ctest --test-dir test/build -C ${{ env.BUILD_TYPE }} --output-on-failure

  emscripten-test:
    name: Test on emscripten
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.21

      - name: Configure Test Project
        run: |
          emcmake cmake -S test -B test/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CROSSCOMPILING_EMULATOR=$(which node)

      - name: Build Test Project
        run: cmake --build test/build --parallel

      - name: Run Tests
        run: ctest --test-dir test/build --output-on-failure